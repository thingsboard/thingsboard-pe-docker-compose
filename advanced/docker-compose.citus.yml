services:
  citus-coordinator:
    restart: always
    image: "citusdata/citus:12.1"
    labels: ["com.citusdata.role=Coordinator"]
    command: ["postgres", "-c", "shared_preload_libraries=citus"]
    ports:
      - "5432"
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../tb-node/citus/coordinator:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
  citus-worker-1:
    restart: always
    image: "citusdata/citus:12.1"
    labels: ["com.citusdata.role=Worker"]
    command: ["postgres", "-c", "shared_preload_libraries=citus"]
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../tb-node/citus/worker-1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
  citus-worker-2:
    restart: always
    image: "citusdata/citus:12.1"
    labels: ["com.citusdata.role=Worker"]
    command: ["postgres", "-c", "shared_preload_libraries=citus"]
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../tb-node/citus/worker-2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
  # The membership manager watches the Docker socket and automatically registers
  # the labelled worker containers with the coordinator (citus_set_coordinator_host +
  # citus_add_node), so no manual node registration is required.
  citus-manager:
    restart: always
    image: "citusdata/membership-manager:0.3.0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CITUS_HOST: citus-coordinator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      citus-coordinator:
        condition: service_healthy
  tb-core1:
    env_file:
      - ../tb-node.postgres.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://citus-coordinator:5432/thingsboard
      DATABASE_CITUS_ENABLED: "true"
      DATABASE_CITUS_SHARD_COUNT: "${CITUS_SHARD_COUNT}"
    depends_on:
      - citus-coordinator
  tb-core2:
    env_file:
      - ../tb-node.postgres.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://citus-coordinator:5432/thingsboard
      DATABASE_CITUS_ENABLED: "true"
      DATABASE_CITUS_SHARD_COUNT: "${CITUS_SHARD_COUNT}"
    depends_on:
      - citus-coordinator
  tb-rule-engine1:
    env_file:
      - ../tb-node.postgres.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://citus-coordinator:5432/thingsboard
      DATABASE_CITUS_ENABLED: "true"
      DATABASE_CITUS_SHARD_COUNT: "${CITUS_SHARD_COUNT}"
    depends_on:
      - citus-coordinator
  tb-rule-engine2:
    env_file:
      - ../tb-node.postgres.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://citus-coordinator:5432/thingsboard
      DATABASE_CITUS_ENABLED: "true"
      DATABASE_CITUS_SHARD_COUNT: "${CITUS_SHARD_COUNT}"
    depends_on:
      - citus-coordinator
